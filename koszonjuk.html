<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Köszönjük! | Empire Build</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0B0F;--paper:#ffffff;--muted:#4b4f56;--neon:#B4FF39;--neon-ink:#0B0B0F;--neon-glow:rgba(180,255,57,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:19px}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);padding:24px;font-weight:500}
.mark{width:52px;height:52px;background:var(--ink);border-radius:13px;display:grid;place-items:center;color:var(--neon);font-size:1.7rem;margin:0 auto 22px}
h1{font-family:"Archivo",sans-serif;font-weight:900;font-size:clamp(1.8rem,6vw,2.6rem);letter-spacing:-.01em;margin-bottom:14px}
p{color:var(--muted);font-size:1.05rem;max-width:420px;margin:0 auto 30px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:"Archivo";font-weight:800;font-size:1.05rem;padding:16px 28px;border-radius:12px;background:var(--neon);color:var(--neon-ink);box-shadow:0 8px 30px var(--neon-glow);text-decoration:none;transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
@media(max-width:480px){html{font-size:17px}}
</style>
</head>
<body>
  <div>
    <div class="mark">◆</div>
    <h1>Köszönjük, megkaptuk!</h1>
    <p>Hamarosan felvesszük Önnel a kapcsolatot.</p>
    <a class="btn" href="index.html">Vissza a főoldalra</a>
  </div>
</body>
</html>
